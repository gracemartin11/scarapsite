name: Scrape Foodies Profiles

on:
  workflow_dispatch:
    inputs:
      list_url:
        description: 'Main list URL (e.g. https://foodies.com/food/ or https://www.foodies.com/foods/)'
        required: true
        default: 'https://foodies.com/food/'
        type: string
      max_profiles:
        description: 'Maximum number of NEW profiles to scrape this run (e.g. 50)'
        required: true
        default: '50'
        type: string
      start_page:
        description: 'Starting page number'
        required: false
        default: '1'
        type: string
      tab_name:
        description: 'Excel sheet/tab name to write into (created if missing, appended if it exists)'
        required: true
        default: 'Sheet1'
        type: string
      mega_folder:
        description: 'Folder path on your Mega.nz drive to store/sync files (created if missing)'
        required: false
        default: 'foodies-scraper'
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      XLSX_PATH: foodies_profiles.xlsx
      URLS_PATH: image_urls.txt
      IDS_PATH: scraped_profile_ids.txt
      MEGA_FOLDER: ${{ github.event.inputs.mega_folder }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          echo "=== Installing Python packages ==="
          python -m pip install --upgrade pip
          pip install playwright pandas openpyxl beautifulsoup4 lxml
          echo "=== Installing Chromium for Playwright ==="
          playwright install chromium --with-deps
          echo "=== Dependencies ready ==="

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone (Mega remote from secret)
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          if [ -z "$RCLONE_CONFIG_B64" ]; then
            echo "::error::RCLONE_CONFIG_B64 secret is not set. See workflow header for setup instructions."
            exit 1
          fi
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_B64" | base64 -d > ~/.config/rclone/rclone.conf

          if ! grep -qE '^\[.+\]' ~/.config/rclone/rclone.conf; then
            echo "::error::RCLONE_CONFIG_B64 did not decode to a valid rclone config."
            echo "First line of decoded content (for debugging, should look like '[mega]'):"
            head -n 1 ~/.config/rclone/rclone.conf
            echo ""
            echo "Fix: run 'rclone config file' locally to find your rclone.conf path, then:"
            echo "  base64 -w0 /path/to/rclone.conf"
            echo "Copy that ENTIRE single-line output (no extra spaces/newlines) into the"
            echo "RCLONE_CONFIG_B64 GitHub secret, replacing whatever is there now."
            exit 1
          fi

          if ! grep -q '^\[mega\]' ~/.config/rclone/rclone.conf; then
            echo "::warning::No [mega] remote found in the config. Make sure your rclone remote is literally named 'mega'."
          fi

          rclone lsd "mega:${MEGA_FOLDER}" || echo "Mega folder does not exist yet, will be created on upload."

      - name: Pull existing state from Mega (dedup files + xlsx)
        run: |
          mkdir -p work
          rclone copy "mega:${MEGA_FOLDER}/${URLS_PATH}" work/ || echo "No existing image_urls.txt on Mega yet."
          rclone copy "mega:${MEGA_FOLDER}/${IDS_PATH}" work/ || echo "No existing scraped_profile_ids.txt on Mega yet."
          rclone copy "mega:${MEGA_FOLDER}/${XLSX_PATH}" work/ || echo "No existing xlsx on Mega yet."
          ls -la work/ || true

      - name: Scrape profiles and update XLSX (dedup + retry-stop logic)
        env:
          LIST_URL: ${{ github.event.inputs.list_url }}
          MAX_PROFILES: ${{ github.event.inputs.max_profiles }}
          START_PAGE: ${{ github.event.inputs.start_page }}
          TAB_NAME: ${{ github.event.inputs.tab_name }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u << 'PYEOF'
          import os
          import sys
          import time
          import re
          from urllib.parse import urljoin, urlparse, urlunparse, parse_qs, urlencode
          from playwright.sync_api import sync_playwright
          from bs4 import BeautifulSoup
          from openpyxl import Workbook, load_workbook

          def log(msg):
              ts = time.strftime("%H:%M:%S")
              print(f"[{ts}] {msg}", flush=True)
              sys.stdout.flush()

          LIST_URL = os.environ.get("LIST_URL", "https://foodies.com/food/").strip()
          MAX_PROFILES = int(os.environ.get("MAX_PROFILES", "50"))
          START_PAGE = int(os.environ.get("START_PAGE", "1"))
          TAB_NAME = os.environ.get("TAB_NAME", "Sheet1").strip() or "Sheet1"
          MAX_RETRIES = 3
          RETRY_DELAY = 3  # seconds

          XLSX_PATH = "work/foodies_profiles.xlsx"
          URLS_PATH = "work/image_urls.txt"
          IDS_PATH = "work/scraped_profile_ids.txt"

          parsed = urlparse(LIST_URL)
          BASE_URL = f"{parsed.scheme}://{parsed.netloc}"

          def build_page_url(base: str, page_num: int) -> str:
              p = urlparse(base)
              qs = parse_qs(p.query)
              if page_num <= 1:
                  qs.pop("page", None)
              else:
                  qs["page"] = [str(page_num)]
              new_query = urlencode(qs, doseq=True)
              return urlunparse((p.scheme, p.netloc, p.path or "/", p.params, new_query, p.fragment))

          # ---- Load persisted dedup state ----
          seen_ids = set()
          if os.path.exists(IDS_PATH):
              with open(IDS_PATH, "r", encoding="utf-8") as f:
                  for line in f:
                      line = line.strip()
                      if line:
                          seen_ids.add(line)
          log(f"Loaded {len(seen_ids)} previously-scraped profile IDs (dedup list).")

          seen_image_urls = set()
          if os.path.exists(URLS_PATH):
              with open(URLS_PATH, "r", encoding="utf-8") as f:
                  for line in f:
                      line = line.strip()
                      if line:
                          seen_image_urls.add(line)
          log(f"Loaded {len(seen_image_urls)} previously-recorded image URLs.")

          # ---- Load or create workbook / target tab ----
          if os.path.exists(XLSX_PATH):
              wb = load_workbook(XLSX_PATH)
              log(f"Loaded existing workbook with sheets: {wb.sheetnames}")
          else:
              wb = Workbook()
              wb.remove(wb.active)
              log("No existing workbook found, creating a new one.")

          if TAB_NAME in wb.sheetnames:
              ws = wb[TAB_NAME]
              log(f"Appending to existing tab '{TAB_NAME}' (current rows: {ws.max_row}).")
          else:
              ws = wb.create_sheet(title=TAB_NAME)
              ws.append(["image_url", "full_name", "about", "profile_url"])
              log(f"Created new tab '{TAB_NAME}'.")

          profile_urls = []      # NEW profile urls to visit this run
          page = START_PAGE
          retry_count = 0

          log("=" * 60)
          log("PHASE 1: Collect NEW profile URLs from list pages")
          log(f"  list_url     = {LIST_URL}")
          log(f"  BASE_URL     = {BASE_URL}")
          log(f"  max_new      = {MAX_PROFILES}")
          log(f"  start_page   = {START_PAGE}")
          log("=" * 60)

          stopped_reason = "max_profiles_reached"

          with sync_playwright() as p:
              log("Launching Playwright + Chromium ...")
              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--disable-blink-features=AutomationControlled",
                      "--no-sandbox",
                      "--disable-dev-shm-usage",
                      "--disable-http2",  # this site's HTTP/2 handshake fails against headless Chromium
                  ],
              )
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
                  viewport={"width": 1280, "height": 900},
                  locale="en-US",
              )
              context.add_init_script("""
                  Object.defineProperty(navigator, 'webdriver', {get: () => undefined});
              """)
              page_obj = context.new_page()
              page_obj.on("console", lambda msg: log(f"  [browser] {msg.type}: {msg.text}"))
              page_obj.on("pageerror", lambda err: log(f"  [page error] {err}"))
              page_obj.on("requestfailed", lambda req: log(f"  [req failed] {req.url[:80]} → {req.failure}"))

              # ========== PHASE 1: collect NEW profile links ==========
              while len(profile_urls) < MAX_PROFILES:
                  url = build_page_url(LIST_URL, page)
                  log("-" * 50)
                  log(f"LIST PAGE {page} (retry {retry_count}/{MAX_RETRIES}) → {url}")
                  log(f"  new collected so far: {len(profile_urls)} / {MAX_PROFILES}")

                  try:
                      t0 = time.time()
                      resp = page_obj.goto(url, wait_until="domcontentloaded", timeout=60000)
                      log(f"  → goto done in {time.time()-t0:.1f}s | status={resp.status if resp else 'N/A'}")
                      page_obj.wait_for_timeout(2000)
                      page_obj.evaluate("window.scrollTo(0, document.body.scrollHeight / 2)")
                      page_obj.wait_for_timeout(800)
                      page_obj.evaluate("window.scrollTo(0, document.body.scrollHeight)")
                      page_obj.wait_for_timeout(1200)
                      html = page_obj.content()
                      log(f"  → HTML length: {len(html)}")
                  except Exception as e:
                      log(f"  ✗ ERROR on list page {page}: {type(e).__name__}: {e}")
                      html = ""

                  soup = BeautifulSoup(html, "lxml") if html else BeautifulSoup("", "lxml")
                  title = (soup.title.string or "(no title)").strip() if soup.title else "(no title)"
                  log(f"  Page title: {title}")

                  links = soup.select("div.grid_item a[href*='/profile/']")
                  log(f"  selector 'div.grid_item a[href*=\"/profile/\"]' → {len(links)}")
                  if not links:
                      links = soup.select("a[href*='/profile/?id=']")
                      log(f"  fallback 'a[href*=\"/profile/?id=\"]' → {len(links)}")
                  if not links:
                      links = soup.select("a[data-slug]")
                      log(f"  fallback 'a[data-slug]' → {len(links)}")
                  if not links:
                      links = soup.select("a[href*='profile']")
                      log(f"  fallback 'a[href*=\"profile\"]' → {len(links)}")

                  if not links:
                      body_preview = (soup.body.get_text(" ", strip=True)[:250] if soup.body else "")
                      log(f"  Body text preview: {body_preview!r}")
                      paginator = soup.select_one("div.paginator")
                      log(f"  paginator present: {bool(paginator)}")
                      new_on_page = 0
                  else:
                      new_on_page = 0
                      for a in links:
                          if len(profile_urls) >= MAX_PROFILES:
                              break
                          href = a.get("href") or ""
                          if not href:
                              continue
                          full = urljoin(BASE_URL, href)
                          m = re.search(r"[?&]id=([^&]+)", full) or re.search(r"/profile/([^/?]+)", full)
                          pid = m.group(1) if m else full

                          if pid in seen_ids:
                              continue  # already scraped in a previous run (or earlier this run)

                          seen_ids.add(pid)
                          profile_urls.append(full)
                          new_on_page += 1
                          if new_on_page <= 5 or new_on_page % 10 == 0:
                              log(f"    + NEW profile URL [{len(profile_urls)}]: {full}")

                  log(f"  Added {new_on_page} NEW (non-duplicate) profile URLs this page → total new: {len(profile_urls)}")

                  if new_on_page == 0:
                      retry_count += 1
                      if retry_count >= MAX_RETRIES:
                          log(f"No new profiles after {MAX_RETRIES} retries on page {page}. "
                              f"Treating this as the end of available/new data. Stopping (success).")
                          stopped_reason = "no_new_data_after_retries"
                          break
                      log(f"No new profiles found, retrying page {page} in {RETRY_DELAY}s "
                          f"({retry_count}/{MAX_RETRIES})...")
                      time.sleep(RETRY_DELAY)
                      continue  # retry same page, don't advance

                  retry_count = 0

                  next_link = soup.select_one(
                      "div.paginator a.next, a.next.pill, a[aria-label='Next page'], a[title='Next page']"
                  )
                  has_next = bool(next_link and next_link.get("href"))
                  if not has_next:
                      page_links = soup.select("div.paginator a[href*='page='], a.pill[href*='page=']")
                      if page_links:
                          try:
                              nums = [
                                  int(re.search(r"page=(\d+)", a.get("href", "")).group(1))
                                  for a in page_links if re.search(r"page=(\d+)", a.get("href", ""))
                              ]
                              max_p = max(nums) if nums else page
                              if page < max_p:
                                  has_next = True
                          except Exception as e:
                              log(f"  page-num parse error: {e}")

                  if not has_next and len(profile_urls) < MAX_PROFILES:
                      log("  No more list pages (paginator says so). Stopping.")
                      stopped_reason = "no_more_pages"
                      break

                  page += 1
                  time.sleep(1.0)

              log("=" * 60)
              log(f"PHASE 1 DONE → {len(profile_urls)} NEW profile URLs to visit. Reason if stopped early: {stopped_reason}")
              log("=" * 60)

              new_count = 0

              if not profile_urls:
                  log("No new profile URLs found. Nothing to visit in Phase 2.")
              else:
                  log("PHASE 2: Visit each NEW profile page and extract name / about / image")
                  log("=" * 60)

                  for i, purl in enumerate(profile_urls, 1):
                      log("-" * 40)
                      log(f"PROFILE {i}/{len(profile_urls)} → {purl}")

                      try:
                          t0 = time.time()
                          resp = page_obj.goto(purl, wait_until="domcontentloaded", timeout=45000)
                          log(f"  goto done in {time.time()-t0:.1f}s | status={resp.status if resp else 'N/A'}")
                          page_obj.wait_for_timeout(2000)
                          page_obj.evaluate("window.scrollTo(0, 400)")
                          page_obj.wait_for_timeout(800)
                          html = page_obj.content()
                          log(f"  HTML length: {len(html)}")
                      except Exception as e:
                          log(f"  ✗ ERROR loading profile: {type(e).__name__}: {e}")
                          ws.append(["", "", f"ERROR: {e}", purl])
                          new_count += 1
                          continue

                      soup = BeautifulSoup(html, "lxml")
                      title = (soup.title.string or "").strip() if soup.title else ""

                      full_name = ""
                      for sel in [
                          "h1", "h1.name", "h1.profile-name", ".profile-name", ".full-name",
                          ".card-title", "[class*='name']", "h2", "h3",
                      ]:
                          el = soup.select_one(sel)
                          if el:
                              t = el.get_text(strip=True)
                              if t and len(t) < 120:
                                  full_name = t
                                  break
                      if not full_name and title:
                          full_name = title.split("|")[0].split("-")[0].strip()

                      about = ""
                      for sel in [
                          ".about", ".bio", ".description", ".profile-about", ".profile-bio",
                          "[class*='about']", "[class*='bio']", "[class*='description']",
                          ".card-body p", "section p", "article p", "p",
                      ]:
                          els = soup.select(sel)
                          for el in els:
                              t = el.get_text(" ", strip=True)
                              t = re.sub(r"\s+", " ", t).strip()
                              if 20 < len(t) < 2000:
                                  about = t
                                  break
                          if about:
                              break

                      image_url = ""
                      for sel in [
                          "img.profile-image", "img.avatar", "img[class*='profile']",
                          "img[class*='avatar']", "img[class*='photo']",
                          "meta[property='og:image']", "meta[name='twitter:image']",
                          "img",
                      ]:
                          if sel.startswith("meta"):
                              el = soup.select_one(sel)
                              if el and el.get("content"):
                                  image_url = urljoin(BASE_URL, el["content"])
                                  break
                          else:
                              for img in soup.select(sel):
                                  src = (
                                      img.get("src")
                                      or img.get("data-src")
                                      or img.get("data-lazy-src")
                                      or img.get("data-original")
                                      or ""
                                  )
                                  if src and not src.startswith("data:") and "icon" not in src.lower() and "logo" not in src.lower():
                                      image_url = urljoin(BASE_URL, src)
                                      break
                          if image_url:
                              break

                      ws.append([image_url, full_name, about, purl])
                      if image_url:
                          seen_image_urls.add(image_url)
                      new_count += 1
                      log(f"  ✓ saved: name={full_name[:40]!r} | img={bool(image_url)} | about_len={len(about)}")

                      time.sleep(0.8)

              log("Closing browser ...")
              browser.close()
              log("Browser closed")

          log("=" * 60)
          log(f"SCRAPE FINISHED → {new_count} new profiles added. Stop reason: {stopped_reason}")
          log("=" * 60)

          # ---- Save workbook ----
          wb.save(XLSX_PATH)
          log(f"Saved workbook to {XLSX_PATH} (tab '{TAB_NAME}' now has {ws.max_row - 1} data rows).")

          # ---- Save updated dedup files ----
          with open(IDS_PATH, "w", encoding="utf-8") as f:
              for pid in sorted(seen_ids):
                  f.write(pid + "\n")
          log(f"Saved {len(seen_ids)} total profile IDs to {IDS_PATH}.")

          with open(URLS_PATH, "w", encoding="utf-8") as f:
              for u in sorted(seen_image_urls):
                  f.write(u + "\n")
          log(f"Saved {len(seen_image_urls)} total image URLs to {URLS_PATH}.")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"NEW_PROFILES_COUNT={new_count}\n")
              f.write(f"STOP_REASON={stopped_reason}\n")
          PYEOF

      - name: Push updated state back to Mega
        run: |
          rclone copy work/${{ env.XLSX_PATH }} "mega:${MEGA_FOLDER}/" --create-empty-src-dirs
          rclone copy work/${{ env.URLS_PATH }} "mega:${MEGA_FOLDER}/" --create-empty-src-dirs
          rclone copy work/${{ env.IDS_PATH }} "mega:${MEGA_FOLDER}/" --create-empty-src-dirs
          echo "Uploaded to mega:${MEGA_FOLDER}/"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foodies-profiles
          path: |
            work/foodies_profiles.xlsx
            work/image_urls.txt
            work/scraped_profile_ids.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Summary
        run: |
          echo "### Scrape complete" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ github.event.inputs.list_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tab name**: ${{ github.event.inputs.tab_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Max new profiles requested**: ${{ github.event.inputs.max_profiles }}" >> $GITHUB_STEP_SUMMARY
          echo "- **New profiles added this run**: ${{ env.NEW_PROFILES_COUNT }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Stop reason**: ${{ env.STOP_REASON }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Mega folder**: ${{ github.event.inputs.mega_folder }}" >> $GITHUB_STEP_SUMMARY
          if [ -f work/foodies_profiles.xlsx ]; then
            echo "- **Artifact**: foodies_profiles.xlsx, image_urls.txt, scraped_profile_ids.txt uploaded (Actions + Mega)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **No file produced**" >> $GITHUB_STEP_SUMMARY
          fi
