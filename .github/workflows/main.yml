name: Scrape Foodies Profiles

on:
  workflow_dispatch:
    inputs:
      list_url:
        description: 'Main list URL to scrape from (e.g. https://www.foodies.com/foods/ or any other page)'
        required: true
        default: 'https://www.foodies.com/foods/'
        type: string
      max_profiles:
        description: 'Maximum number of NEW profiles to scrape this run (e.g. 50)'
        required: true
        default: '50'
        type: string
      start_page:
        description: 'Starting page number'
        required: false
        default: '1'
        type: string
      tab_name:
        description: 'Excel sheet/tab name to write into (created if missing, appended if it exists)'
        required: true
        default: 'Sheet1'
        type: string
      mega_folder:
        description: 'Folder path on your Mega.nz drive to store/sync files (created if missing)'
        required: false
        default: 'foodies-scraper'
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      XLSX_PATH: foodies_profiles.xlsx
      URLS_PATH: image_urls.txt
      MEGA_FOLDER: ${{ github.event.inputs.mega_folder }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas openpyxl lxml

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone (Mega remote from secret)
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          if [ -z "$RCLONE_CONFIG_B64" ]; then
            echo "::error::RCLONE_CONFIG_B64 secret is not set. See workflow header for setup instructions."
            exit 1
          fi
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_B64" | base64 -d > ~/.config/rclone/rclone.conf
          # Sanity check the remote is reachable (won't fail the job if empty folder)
          rclone lsd "mega:${MEGA_FOLDER}" || echo "Mega folder does not exist yet, will be created on upload."

      - name: Pull existing state from Mega (dedup list + xlsx)
        run: |
          mkdir -p work
          rclone copy "mega:${MEGA_FOLDER}/${URLS_PATH}" work/ || echo "No existing image_urls.txt on Mega yet."
          rclone copy "mega:${MEGA_FOLDER}/${XLSX_PATH}" work/ || echo "No existing xlsx on Mega yet."
          ls -la work/ || true

      - name: Scrape profiles and update XLSX (dedup + retry-stop logic)
        env:
          LIST_URL: ${{ github.event.inputs.list_url }}
          MAX_PROFILES: ${{ github.event.inputs.max_profiles }}
          START_PAGE: ${{ github.event.inputs.start_page }}
          TAB_NAME: ${{ github.event.inputs.tab_name }}
        run: |
          python << 'PYEOF'
          import os
          import time
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse, urlunparse, parse_qs, urlencode
          from openpyxl import Workbook, load_workbook

          LIST_URL = os.environ.get("LIST_URL", "").strip()
          if not LIST_URL.endswith("/") and "?" not in LIST_URL:
              LIST_URL = LIST_URL + "/"
          parsed = urlparse(LIST_URL)
          BASE_URL = f"{parsed.scheme}://{parsed.netloc}"
          MAX_PROFILES = int(os.environ.get("MAX_PROFILES", "50"))
          START_PAGE = int(os.environ.get("START_PAGE", "1"))
          TAB_NAME = os.environ.get("TAB_NAME", "Sheet1").strip() or "Sheet1"

          URLS_PATH = "work/image_urls.txt"
          XLSX_PATH = "work/foodies_profiles.xlsx"
          MAX_RETRIES = 3
          RETRY_DELAY = 3  # seconds

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.5",
          }
          session = requests.Session()
          session.headers.update(headers)

          # ---- Load existing dedup set ----
          seen_urls = set()
          if os.path.exists(URLS_PATH):
              with open(URLS_PATH, "r", encoding="utf-8") as f:
                  for line in f:
                      line = line.strip()
                      if line:
                          seen_urls.add(line)
          print(f"Loaded {len(seen_urls)} previously scraped image URLs (dedup list).")

          # ---- Load or create workbook / target tab ----
          if os.path.exists(XLSX_PATH):
              wb = load_workbook(XLSX_PATH)
              print(f"Loaded existing workbook with sheets: {wb.sheetnames}")
          else:
              wb = Workbook()
              default_ws = wb.active
              wb.remove(default_ws)
              print("No existing workbook found, creating a new one.")

          if TAB_NAME in wb.sheetnames:
              ws = wb[TAB_NAME]
              print(f"Appending to existing tab '{TAB_NAME}' (current rows: {ws.max_row}).")
          else:
              ws = wb.create_sheet(title=TAB_NAME)
              ws.append(["image_url", "full_name", "about"])
              print(f"Created new tab '{TAB_NAME}'.")

          def build_page_url(base, page_num):
              if page_num <= 1:
                  p = urlparse(base)
                  qs = parse_qs(p.query)
                  qs.pop("page", None)
                  new_query = urlencode(qs, doseq=True)
                  return urlunparse((p.scheme, p.netloc, p.path, p.params, new_query, p.fragment))
              p = urlparse(base)
              qs = parse_qs(p.query)
              qs["page"] = [str(page_num)]
              new_query = urlencode(qs, doseq=True)
              return urlunparse((p.scheme, p.netloc, p.path, p.params, new_query, p.fragment))

          def fetch_cards(url):
              try:
                  resp = session.get(url, timeout=30)
                  resp.raise_for_status()
              except Exception as e:
                  print(f"Error fetching {url}: {e}")
                  return None
              soup = BeautifulSoup(resp.text, "lxml")
              cards = soup.select("div.card, article.profile, div.profile-card, .food-card, [class*='card']")
              if not cards:
                  cards = soup.find_all("div", class_=lambda c: c and ("card" in c.lower() or "profile" in c.lower()))
              return soup, cards

          def extract_profile(card):
              img = card.select_one("img")
              image_url = ""
              if img:
                  src = img.get("src") or img.get("data-src") or img.get("data-lazy-src") or ""
                  if src:
                      image_url = urljoin(BASE_URL, src)

              full_name = ""
              name_el = (
                  card.select_one(".card-title")
                  or card.select_one("h2, h3, h4")
                  or card.select_one(".name, .fullname-name, .profile-name, [class*='name']")
                  or card.select_one("a[href*='/']")
              )
              if name_el:
                  full_name = name_el.get_text(strip=True)

              about = ""
              about_el = (
                  card.select_one(".about, .bio, .description, .card-body, .profile-about, [class*='about'], [class*='bio']")
                  or card.select_one("p")
              )
              if about_el:
                  for title in about_el.select(".card-title"):
                      title.decompose()
                  about = about_el.get_text(" ", strip=True)
              else:
                  clone = BeautifulSoup(str(card), "lxml")
                  for t in clone.select(".card-title"):
                      t.decompose()
                  about = clone.get_text(" ", strip=True)
                  if full_name and about.startswith(full_name):
                      about = about[len(full_name):].strip()

              return image_url, full_name, about

          print(f"Starting scrape from: {LIST_URL}")
          print(f"max_new={MAX_PROFILES}, start_page={START_PAGE}, tab='{TAB_NAME}'")

          page = START_PAGE
          retry_count = 0
          new_count = 0
          stopped_reason = "max_profiles_reached"

          while new_count < MAX_PROFILES:
              url = build_page_url(LIST_URL, page)
              print(f"\nFetching page {page} (retry {retry_count}/{MAX_RETRIES}): {url}")

              result = fetch_cards(url)
              if result is None:
                  cards = []
              else:
                  soup, cards = result

              print(f"  Found {len(cards)} potential cards on page {page}")

              new_on_page = 0
              for card in cards:
                  if new_count >= MAX_PROFILES:
                      break
                  image_url, full_name, about = extract_profile(card)

                  if not image_url and not full_name:
                      continue
                  # Dedup strictly on image_url (falls back to name if no image at all)
                  dedup_key = image_url if image_url else f"name::{full_name}"
                  if dedup_key in seen_urls:
                      continue

                  seen_urls.add(dedup_key)
                  ws.append([image_url, full_name, about])
                  new_count += 1
                  new_on_page += 1

              print(f"  Added {new_on_page} new profiles this page (total new this run: {new_count})")

              if new_on_page == 0:
                  retry_count += 1
                  if retry_count >= MAX_RETRIES:
                      print(f"No new profiles after {MAX_RETRIES} retries on page {page}. "
                            f"Treating this as the end of available data. Stopping scrape (success).")
                      stopped_reason = "no_new_data_after_retries"
                      break
                  print(f"No new profiles found, retrying page {page} in {RETRY_DELAY}s "
                        f"({retry_count}/{MAX_RETRIES})...")
                  time.sleep(RETRY_DELAY)
                  continue  # retry same page, do not advance
              else:
                  retry_count = 0
                  page += 1

              time.sleep(1.5)  # be polite between pages

          print(f"\nScrape finished. Reason: {stopped_reason}. New profiles this run: {new_count}.")

          # ---- Save workbook ----
          wb.save(XLSX_PATH)
          print(f"Saved workbook to {XLSX_PATH} (tab '{TAB_NAME}' now has {ws.max_row - 1} data rows).")

          # ---- Save updated dedup list ----
          with open(URLS_PATH, "w", encoding="utf-8") as f:
              for u in sorted(seen_urls):
                  f.write(u + "\n")
          print(f"Saved {len(seen_urls)} total unique keys to {URLS_PATH}.")

          # Expose values to later steps
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"NEW_PROFILES_COUNT={new_count}\n")
              f.write(f"STOP_REASON={stopped_reason}\n")
          PYEOF

      - name: Push updated state back to Mega
        run: |
          rclone copy work/${{ env.URLS_PATH }} "mega:${MEGA_FOLDER}/" --create-empty-src-dirs
          rclone copy work/${{ env.XLSX_PATH }} "mega:${MEGA_FOLDER}/" --create-empty-src-dirs
          echo "Uploaded to mega:${MEGA_FOLDER}/"

      - name: Upload XLSX + dedup list as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foodies-profiles
          path: |
            work/foodies_profiles.xlsx
            work/image_urls.txt
          retention-days: 30

      - name: Summary
        run: |
          echo "### Scrape complete" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ github.event.inputs.list_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tab name**: ${{ github.event.inputs.tab_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Max new profiles requested**: ${{ github.event.inputs.max_profiles }}" >> $GITHUB_STEP_SUMMARY
          echo "- **New profiles added this run**: ${{ env.NEW_PROFILES_COUNT }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Stop reason**: ${{ env.STOP_REASON }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Mega folder**: ${{ github.event.inputs.mega_folder }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact**: foodies_profiles.xlsx + image_urls.txt uploaded (to Actions + Mega)" >> $GITHUB_STEP_SUMMARY
